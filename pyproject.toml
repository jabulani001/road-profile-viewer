[project]
name = "route-analyzer"
version = "0.1.0"
description = "Route analyzer with elevation profile, calorie tracker and fuel consumption calculator"
readme = "README.md"
authors = [
    { name = "jabulani001", email = "albanleci5@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dash>=2.14.0",
    "plotly>=5.18.0",
    "numpy>=1.26.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
route-analyzer = "road_profile_viewer.main:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"
